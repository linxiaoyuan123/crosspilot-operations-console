services:
  crosspilot:
    build: .
    container_name: crosspilot-console
    environment:
      HOST: 0.0.0.0
      PORT: 3100
      DB_PATH: /app/data/crosspilot.db
    ports:
      - "3100:3100"
    volumes:
      - crosspilot-data:/app/data
    restart: unless-stopped

volumes:
  crosspilot-data:
