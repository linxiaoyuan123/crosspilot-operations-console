<!doctype html>
<html lang="zh-CN" data-font-mode="literary" data-theme-mode="dark" data-theme="dark" data-wallpaper-mode="fullscreen" data-fullscreen-layout="classic">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CrossPilot 跨境电商运营决策中台 - 从报表导入、利润核算到运营动作闭环">
    <meta name="theme-color" content="#123b3a">
    <link rel="icon" href="/pig.png" type="image/png">
    <link rel="apple-touch-icon" href="/pig.png">
    <title>CrossPilot · 跨境电商运营决策中台</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('crosspilot-color-mode') || 'dark';
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const resolved = stored === 'system' ? (systemDark ? 'dark' : 'light') : stored === 'light' ? 'light' : 'dark';
          document.documentElement.dataset.themeMode = stored;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.classList.toggle('dark', resolved === 'dark');
        } catch {}
      })();
    </script>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/final-shell.css">
    <link rel="stylesheet" href="/crosspilot.css">
    <link rel="stylesheet" href="/enhancements.css">
    <link rel="stylesheet" href="/firefly-controls.css">
  </head>
  <body>
    <div id="sakura-layer" aria-hidden="true"></div>

    <div class="app-shell">
      <header class="app-header">
        <span class="app-header-progress" aria-hidden="true"><span id="nav-progress"></span></span>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><img src="/pig.png" alt=""></span>
          <span class="brand-copy">
            <strong>CrossPilot</strong>
            <small>跨境电商运营决策中台</small>
          </span>
        </div>

        <nav class="main-nav" aria-label="主导航">
          <button class="nav-item is-active" type="button" data-nav="overview">
            <span data-icon="overview"></span><span data-label="运营总览">运营总览</span>
          </button>
          <div class="nav-tools">
            <button class="nav-item nav-tools-trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="operations-tools-menu">
              <span data-icon="tools"></span><span data-label="运营工具">运营工具</span><span class="nav-tools-caret" data-icon="chevronDown"></span>
            </button>
            <div class="nav-tools-menu" id="operations-tools-menu" role="menu" aria-label="运营流程工具">
              <button class="nav-item" type="button" role="menuitem" data-nav="imports">
                <span data-icon="imports"></span><span data-label="数据导入">数据导入</span>
              </button>
              <button class="nav-item" type="button" role="menuitem" data-nav="listings">
                <span data-icon="listings"></span><span data-label="Listing与商品">Listing与商品</span>
              </button>
              <button class="nav-item" type="button" role="menuitem" data-nav="ads">
                <span data-icon="ads"></span><span data-label="广告与流量">广告与流量</span>
              </button>
              <button class="nav-item" type="button" role="menuitem" data-nav="inventory">
                <span data-icon="inventory"></span><span data-label="库存与履约">库存与履约</span>
              </button>
              <button class="nav-item" type="button" role="menuitem" data-nav="aftersales">
                <span data-icon="aftersales"></span><span data-label="售后与账号">售后与账号</span>
              </button>
              <button class="nav-item" type="button" role="menuitem" data-nav="reviews">
                <span data-icon="reviews"></span><span data-label="运营复盘">运营复盘</span>
              </button>
            </div>
          </div>
        </nav>

        <div class="app-header-actions">
          <div class="cp-utility-cluster" aria-label="全局工具">
            <div class="cp-global-search">
              <span data-icon="search" aria-hidden="true"></span>
              <input id="cp-global-search-input" type="search" autocomplete="off" placeholder="搜索" aria-label="全局搜索" aria-controls="cp-search-panel" aria-expanded="false">
              <button class="cp-search-clear" id="cp-global-search-clear" type="button" aria-label="清空搜索" hidden><span data-icon="x"></span></button>
              <div class="cp-float-panel cp-search-panel" id="cp-search-panel" role="listbox" aria-label="搜索结果" hidden></div>
            </div>

            <div class="cp-popover">
              <button class="cp-tool-button" id="cp-music-toggle" type="button" aria-label="打开音乐播放器" aria-controls="cp-music-panel" aria-expanded="false" title="音乐播放器">
                <span data-icon="music" aria-hidden="true"></span>
                <span class="cp-equalizer" aria-hidden="true"><i></i><i></i><i></i></span>
              </button>
              <section class="cp-float-panel cp-music-panel" id="cp-music-panel" aria-label="音乐播放器" hidden>
                <div class="cp-music-summary">
                  <span class="cp-music-cover"><img src="/assets/media/firefly-cover.webp" alt="唱片封面"></span>
                  <span><small>正在播放</small><strong id="cp-music-title">使一颗心免于哀伤</strong><em id="cp-music-artist">知更鸟 / HOYO-MiX / Chevy</em></span>
                </div>
                <div class="cp-music-progress">
                  <input id="cp-music-progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="播放进度">
                  <span><time id="cp-music-current">0:00</time><time id="cp-music-duration">0:00</time></span>
                </div>
                <div class="cp-music-controls">
                  <button type="button" id="cp-music-replay" aria-label="回到开头" title="回到开头"><span data-icon="replay" aria-hidden="true"></span></button>
                  <button type="button" id="cp-music-play" aria-label="播放或暂停" title="播放或暂停"><span data-icon="play" aria-hidden="true"></span><span hidden data-cp-music-pause-icon data-icon="pause" aria-hidden="true"></span></button>
                  <div class="cp-music-volume">
                    <span data-icon="volume" aria-hidden="true"></span>
                    <input id="cp-music-volume" type="range" min="0" max="1" value="0.7" step="0.05" aria-label="音量">
                  </div>
                </div>
                <audio id="cp-audio" preload="metadata" loop><source src="/assets/media/firefly-sample.mp3" type="audio/mpeg"></audio>
              </section>
            </div>

            <button class="cp-tool-button" id="cp-video-toggle" type="button" aria-label="播放主页背景视频" aria-pressed="false" title="播放主页背景视频">
              <span data-icon="play" class="cp-icon-play" aria-hidden="true"></span>
              <span data-icon="pause" class="cp-icon-pause" aria-hidden="true" hidden></span>
            </button>

            <div class="cp-popover">
              <button class="cp-tool-button" id="cp-theme-toggle" type="button" aria-label="打开主题定制" aria-controls="cp-theme-panel" aria-expanded="false" title="主题定制">
                <span data-icon="palette" aria-hidden="true"></span>
              </button>
              <section class="cp-float-panel cp-theme-panel" id="cp-theme-panel" aria-label="主题定制" hidden>
                <div class="cp-theme-tabs" role="tablist" aria-label="主题设置分类">
                  <button type="button" role="tab" aria-selected="true" data-cp-theme-tab="appearance"><span data-icon="palette"></span><span>外观</span></button>
                  <button type="button" role="tab" aria-selected="false" data-cp-theme-tab="wallpaper"><span data-icon="wallpaper"></span><span>壁纸</span></button>
                  <button type="button" role="tab" aria-selected="false" data-cp-theme-tab="effects"><span data-icon="flower"></span><span>特效</span></button>
                </div>

                <div class="cp-theme-tab-panel" data-cp-theme-panel="appearance">
                  <div class="cp-setting-heading"><strong>主题色相</strong><button type="button" id="cp-hue-reset" aria-label="恢复默认主题色"><span data-icon="replay"></span></button><output id="cp-hue-value">191</output></div>
                  <div class="cp-hue-track"><input id="cp-hue-slider" type="range" min="0" max="360" value="191" step="1" aria-label="主题色相"></div>
                  <div class="cp-setting-heading"><strong>内容布局</strong></div>
                  <div class="cp-segment" role="group" aria-label="内容布局">
                    <button type="button" data-cp-density="comfortable" aria-pressed="true"><span data-icon="rows"></span>舒展开阔</button>
                    <button type="button" data-cp-density="compact" aria-pressed="false"><span data-icon="grid"></span>紧凑高效</button>
                  </div>
                  <div class="cp-setting-heading"><strong>卡片样式</strong></div>
                  <button class="cp-setting-toggle" type="button" data-cp-setting="cardBorder" aria-pressed="false"><span data-icon="borderOuter"></span><span>卡片边框与阴影</span><i></i></button>
                  <button class="cp-setting-toggle" type="button" data-cp-setting="followTheme" aria-pressed="true"><span data-icon="palette"></span><span>卡片跟随主题色</span><i></i></button>
                </div>

                <div class="cp-theme-tab-panel" data-cp-theme-panel="wallpaper" hidden>
                  <div class="cp-setting-heading"><strong>壁纸模式</strong></div>
                  <div class="cp-choice-grid" role="group" aria-label="壁纸模式">
                    <button type="button" data-cp-wallpaper="banner" aria-pressed="false"><span data-icon="imageOutline"></span>横幅壁纸</button>
                    <button type="button" data-cp-wallpaper="fullscreen" aria-pressed="true"><span data-icon="wallpaper"></span>全屏壁纸</button>
                    <button type="button" data-cp-wallpaper="overlay" aria-pressed="false"><span data-icon="overlay"></span>覆盖透明</button>
                    <button type="button" data-cp-wallpaper="none" aria-pressed="false"><span data-icon="hideImage"></span>纯色背景</button>
                  </div>
                  <div class="cp-setting-heading" data-cp-layout-heading><strong>全屏布局</strong></div>
                  <div class="cp-segment" role="group" aria-label="全屏布局" data-cp-layout-group>
                    <button type="button" data-cp-layout="classic" aria-pressed="true"><span data-icon="viewDay"></span>经典模式</button>
                    <button type="button" data-cp-layout="hero" aria-pressed="false"><span data-icon="desktopLandscape"></span>Hero 模式</button>
                  </div>
                  <div class="cp-setting-heading" data-cp-transparency-heading><strong>透明设置</strong></div>
                  <div class="cp-range-setting" data-cp-transparency-group>
                    <div class="cp-range-heading"><span>背景模糊度</span><output id="cp-overlay-blur-value">0.0px</output></div>
                    <input id="cp-overlay-blur" type="range" min="0" max="20" value="0" step="0.5" aria-label="背景模糊度">
                    <div class="cp-range-heading"><span>卡片透明度</span><output id="cp-card-opacity-value">100%</output></div>
                    <input id="cp-card-opacity" type="range" min="20" max="100" value="100" step="1" aria-label="卡片透明度">
                  </div>
                  <div class="cp-setting-heading"><strong>壁纸设置</strong></div>
                  <button class="cp-setting-toggle" type="button" data-cp-setting="bannerTitle" aria-pressed="true"><span data-icon="titlecase"></span><span>首页壁纸标题</span><i></i></button>
                  <button class="cp-setting-toggle" type="button" data-cp-setting="carousel" aria-pressed="true"><span data-icon="carousel"></span><span>壁纸轮播</span><i></i></button>
                  <button class="cp-setting-toggle" type="button" data-cp-setting="waves" aria-pressed="true"><span data-icon="airwave"></span><span>水波纹动画</span><i></i></button>
                  <button class="cp-setting-toggle" type="button" data-cp-setting="gradient" aria-pressed="true"><span data-icon="gradient"></span><span>渐变过渡</span><i></i></button>
                </div>

                <div class="cp-theme-tab-panel" data-cp-theme-panel="effects" hidden>
                  <div class="cp-setting-heading"><strong>特效设置</strong></div>
                  <button class="cp-setting-toggle" type="button" data-cp-setting="sakura" aria-pressed="true"><span data-icon="flower"></span><span>樱花特效</span><i></i></button>
                  <button class="cp-setting-toggle" type="button" data-cp-setting="typewriter" aria-pressed="true"><span data-icon="type"></span><span>首页打字机</span><i></i></button>
                </div>
              </section>
            </div>

            <div class="cp-popover cp-color-mode">
              <button class="cp-tool-button" id="cp-color-mode-toggle" type="button" aria-label="切换日夜主题" aria-controls="cp-color-mode-panel" aria-expanded="false" title="日夜主题">
                <span data-icon="moon" class="cp-mode-dark" aria-hidden="true"></span>
                <span data-icon="sun" class="cp-mode-light" aria-hidden="true" hidden></span>
              </button>
              <div class="cp-float-panel cp-color-mode-panel" id="cp-color-mode-panel" role="menu" aria-label="日夜主题" hidden>
                <button type="button" role="menuitemradio" data-cp-color-mode="light" aria-checked="false"><span data-icon="sun"></span>亮色</button>
                <button type="button" role="menuitemradio" data-cp-color-mode="dark" aria-checked="true"><span data-icon="moon"></span>暗色</button>
                <button type="button" role="menuitemradio" data-cp-color-mode="system" aria-checked="false"><span data-icon="monitor"></span>跟随系统</button>
              </div>
            </div>
          </div>

          <button class="font-toggle" id="font-toggle" type="button" aria-label="切换全局字体" title="当前：文艺字体，点击切换原版字体"><span>文</span></button>
          <label class="project-switcher" for="global-store">
            <span>当前店铺</span>
            <select id="global-store" aria-label="切换当前店铺"></select>
          </label>
        </div>
      </header>

      <div class="workspace">
        <section class="hero-banner" aria-label="CrossPilot 跨境电商运营决策中台">
          <div class="hero-slides" aria-hidden="true">
            <div class="hero-slide hero-slide-1"></div>
            <div class="hero-slide hero-slide-2"></div>
            <div class="hero-slide hero-slide-3"></div>
          </div>
          <div class="cp-hero-video-layer" id="cp-hero-video-layer" aria-hidden="true">
            <video id="cp-hero-video" playsinline loop preload="none" poster="/assets/hero-firefly.avif" data-src="https://bed.twoleaf.cn/file/1785658612716_firefly.mp4"></video>
          </div>
          <div class="hero-shade" aria-hidden="true"></div>
          <div class="hero-copy">
            <span class="hero-kicker">CrossPilot · marketplace operations</span>
            <h1>跨境运营，从数据到动作</h1>
            <p class="hero-subtitle"><span id="hero-typewriter"></span><span class="typing-caret" aria-hidden="true"></span></p>
          </div>
          <div class="hero-waves" aria-hidden="true">
            <svg viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="geometricPrecision">
              <defs>
                <path id="crosspilot-gentle-wave" d="M-160 44c30 0 58-18 88-18s58 18 88 18 58-18 88-18 58 18 88 18v48h-352z" />
              </defs>
              <g class="hero-wave-parallax">
                <use href="#crosspilot-gentle-wave" x="48" y="0" class="hero-wave-layer hero-wave-layer-1" />
                <use href="#crosspilot-gentle-wave" x="48" y="3" class="hero-wave-layer hero-wave-layer-2" />
                <use href="#crosspilot-gentle-wave" x="48" y="5" class="hero-wave-layer hero-wave-layer-3" />
                <use href="#crosspilot-gentle-wave" x="48" y="7" class="hero-wave-layer hero-wave-layer-4" />
              </g>
            </svg>
          </div>
        </section>

        <div class="page-frame">
          <aside class="shell-aside shell-aside-left" id="shell-left" aria-label="店铺基础信息"></aside>

          <div class="page-main">
            <header class="topbar">
              <div class="topbar-title">
                <span class="eyebrow" id="page-eyebrow">经营驾驶舱</span>
                <h1 id="page-title">运营总览</h1>
              </div>
            </header>

            <main class="content" id="app" aria-live="polite"></main>
          </div>

          <aside class="shell-aside shell-aside-right" id="shell-right" aria-label="运营状态与快捷入口"></aside>
        </div>
      </div>
    </div>

    <div id="modal-root"></div>
    <div class="toast-stack" id="toast-root" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
    <script type="module" src="/enhancements.js"></script>
  </body>
</html>
